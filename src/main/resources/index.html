<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Feedback</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f3f6fb; color: #1f2937; }
    main { max-width: 620px; margin: 48px auto; padding: 32px; background: white; border-radius: 14px; box-shadow: 0 8px 28px #18243a16; }
    h1 { margin-top: 0; color: #183b66; } p { color: #64748b; }
    label { display: block; margin: 18px 0 7px; font-weight: 600; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 7px; font: inherit; }
    textarea { min-height: 115px; resize: vertical; }
    button { margin-top: 22px; padding: 12px 22px; border: 0; border-radius: 7px; background: #1769aa; color: white; font-weight: 700; cursor: pointer; }
    button:hover { background: #105487; } #status { margin-top: 16px; color: #167044; font-weight: 600; }
  </style>
</head>
<body>
<main>
  <h1>Online Feedback</h1>
  <p>Share your experience. All fields are required.</p>
  <form id="feedbackForm">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" autocomplete="name" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="category">Feedback Category</label>
    <select id="category" name="category" required>
      <option value="">Choose a category</option>
      <option>Website</option><option>Service</option><option>Product</option><option>Other</option>
    </select>
    <label for="rating">Rating</label>
    <select id="rating" name="rating" required>
      <option value="">Choose a rating</option>
      <option value="5">5 - Excellent</option><option value="4">4 - Good</option>
      <option value="3">3 - Average</option><option value="2">2 - Poor</option><option value="1">1 - Very poor</option>
    </select>
    <label for="comments">Comments</label>
    <textarea id="comments" name="comments" placeholder="Write your feedback..." required></textarea>
    <button type="submit">Submit</button>
    <div id="status" role="status" aria-live="polite"></div>
  </form>
</main>
<script>
  document.getElementById('feedbackForm').addEventListener('submit', function(event) {
    event.preventDefault();
    document.getElementById('status').textContent =
      'Thank you! Your feedback form has been submitted (demo only).';
    this.reset();
  });
</script>
</body>
</html>
